<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Courses - WordWise</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G2S551QV48"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-G2S551QV48');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .courses-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 15px;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .course-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .course-image {
            height: 180px;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #cbd5e1;
        }

        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .course-content {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .course-tag {
            display: inline-block;
            padding: 4px 12px;
            background-color: #e0e7ff;
            color: #4338ca;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            align-self: flex-start;
        }

        .course-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1e293b;
            line-height: 1.4;
        }

        .course-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-start {
            margin-top: auto;
            background: var(--primary-color);
            color: white;
            padding: 12px;
            /* Fixed padding error */
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: var(--primary-dark);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #f8fafc;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container nav-container">
                <a href="index.html" class="logo">WordWise<span class="dot">.</span></a>
                <div class="nav-links">
                    <a href="features.html">Features</a>
                    <a href="my-course.html">My Course</a>
                    <a href="flash-cards.html">Flash Cards</a>
                    <a href="subscription.html">Pricing</a>
                    <a href="contact.html">Contact</a>
                    <div class="user-profile-nav">
                        <div class="avatar" title="User Profile"></div>
                        <a href="#" id="logout-btn"
                            style="margin-left: 1rem; color: var(--text-muted); font-size: 0.9rem;">Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="courses-container">
            <div class="page-header">
                <h1>My Courses</h1>
                <p>Continue your learning journey with your enrolled courses.</p>
            </div>

            <div id="courses-grid" class="courses-grid">
                <!-- Loading State -->
                <div style="grid-column: 1/-1; text-align: center; padding: 40px;">Loading your courses...</div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="container copyright">
                <p>&copy; 2024 WordWise Inc. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="/js/navigation.js"></script>
    <script type="module">
        import { authService } from './auth-service.js';
        import { APP_CONFIG } from './config.js';

        async function loadMyCourses() {
            const grid = document.getElementById('courses-grid');

            if (!authService.isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const token = authService.getBackendToken();
                const response = await fetch(`${APP_CONFIG.apiUrl}/course-orders/my-purchases`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const { data } = await response.json();

                if (!data || data.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <h3>No courses yet</h3>
                            <p>You haven't enrolled in any courses yet.</p>
                            <a href="subscription.html" class="btn btn-primary" style="margin-top: 15px; display: inline-block;">Browse Courses</a>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = data.map(purchase => {
                    const course = purchase.courseId;
                    return `
                        <div class="course-card">
                            <div class="course-image">
                                ${course.thumbnailUrl
                            ? `<img src="${course.thumbnailUrl}" alt="${course.title}">`
                            : '<span>📚</span>'}
                            </div>
                            <div class="course-content">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                                    <span class="course-tag">${course.category || 'General'}</span>
                                    <span style="font-size: 0.8rem; color: #64748b; background: #f1f5f9; padding: 4px 8px; border-radius: 6px;">
                                        ID: ${course.courseId || 'N/A'}
                                    </span>
                                </div>
                                <h3 class="course-title">${course.title}</h3>
                                <div class="course-meta">
                                    <span class="meta-item">⚡ ${course.difficultyLevel}</span>
                                    <span class="meta-item">⏱ ${course.estimatedDuration?.value} ${course.estimatedDuration?.unit}</span>
                                </div>
                                <a href="my-course.html?id=${course._id}" class="btn-start">Start Learning</a>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading courses:', error);
                grid.innerHTML = '<p style="color: red; text-align: center;">Failed to load courses. Please try again.</p>';
            }
        }

        loadMyCourses();
    </script>
</body>

</html>
