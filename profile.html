<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - WordWise</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G2S551QV48"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-G2S551QV48');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            color: #1e293b;
        }

        .profile-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .profile-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .profile-header p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            color: #0f172a !important;
            background-color: #ffffff !important;
            -webkit-text-fill-color: #0f172a !important;
            opacity: 1;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-save {
            background: #6366f1;
            /* var(--primary) backup */
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-save:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #d1fae5;
            display: block;
        }

        .message.error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fee2e2;
            display: block;
        }

        .account-overview {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .overview-item h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .overview-item p {
            font-size: 1.1rem;
            color: #0f172a;
            font-weight: 500;
            margin: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-badge.active {
            background-color: #dcfce7;
            color: #166534;
        }

        .status-badge.basic {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .status-badge.premium {
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .status-badge.inactive {
            background-color: #f1f5f9;
            color: #475569;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container nav-container">
                <a href="index.html" class="logo">WordWise<span class="dot">.</span></a>
                <div class="nav-links">
                    <a href="features.html">Features</a>
                    <a href="dashboard.html">Dashboard</a>
                    <a href="subscription.html">Pricing</a>
                    <a href="contact.html">Contact</a>
                    <div class="user-profile-nav">
                        <div class="avatar" title="User Profile"></div>
                        <a href="#" id="logout-btn"
                            style="margin-left: 1rem; color: var(--text-muted); font-size: 0.9rem;">Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Profile Content -->
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-header">
                    <h1>My Profile</h1>
                    <p>Manage your account settings and preferences</p>
                </div>

                <div class="account-overview">
                    <div class="overview-grid">
                        <div class="overview-item">
                            <h3>Member Since</h3>
                            <p id="member-since">Loading...</p>
                        </div>
                        <div class="overview-item">
                            <h3>Subscription</h3>
                            <div id="subscription-status">Loading...</div>
                        </div>
                        <div class="overview-item">
                            <h3>Last Login</h3>
                            <p id="last-login">Loading...</p>
                        </div>
                    </div>
                </div>

                <form id="profile-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>

                    <button type="submit" class="btn-save">Update Account Details</button>
                    <div id="status-message" class="message"></div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="container copyright">
                <p>&copy; 2024 WordWise Inc. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="/js/navigation.js"></script>
    <script type="module" src="/js/profile.js"></script>
</body>

</html>
