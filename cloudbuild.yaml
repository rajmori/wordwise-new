steps:
  # Step 1: Install dependencies
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'server'
    id: 'Install Server Dependencies'

  # Step 2: Run Prisma Client Generation (needed for linting and testing)
  - name: 'node:20'
    entrypoint: 'npx'
    args: ['prisma', 'generate']
    dir: 'server'
    id: 'Generate Prisma Client'

  # Step 3: Run automated test suite
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']
    dir: 'server'
    id: 'Run Automated Tests'

  # Step 4: Build Docker Image for the admin services console
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/wordwise/admin-console:$COMMIT_SHA',
      '-f', 'server/Dockerfile',
      'server'
    ]
    id: 'Build Container Image'

  # Step 5: Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/wordwise/admin-console:$COMMIT_SHA']
    id: 'Push to Artifact Registry'

  # Step 6: Create release via Google Cloud Deploy (triggers rollout to dev -> staging -> production)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'deploy', 'releases', 'create', 'rel-$SHORT_SHA',
      '--delivery-pipeline', 'wordwise-admin-pipeline',
      '--region', 'us-central1',
      '--images', 'admin-console-image=us-central1-docker.pkg.dev/$PROJECT_ID/wordwise/admin-console:$COMMIT_SHA'
    ]
    id: 'Trigger Cloud Deploy Delivery Pipeline'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/wordwise/admin-console:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
