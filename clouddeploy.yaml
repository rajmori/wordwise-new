apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: wordwise-admin-pipeline
description: WordWise SaaS Admin Console Delivery Pipeline
serialPipeline:
  stages:
    - targetId: dev-target
    - targetId: staging-target
    - targetId: prod-target
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev-target
description: Development environment on Cloud Run
run:
  location: projects/PROJECT_ID/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging-target
description: Staging environment on Cloud Run
run:
  location: projects/PROJECT_ID/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod-target
description: Production environment on Cloud Run
run:
  location: projects/PROJECT_ID/locations/us-central1
